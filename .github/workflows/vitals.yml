name: Update vitals

# Pulls the latest Garmin numbers and force-pushes vitals.json, running.json (plus the
# encrypted, refreshed session tokens) as a single commit on the `vitals`
# branch. The site reads it straight from raw.githubusercontent.com, so no
# site rebuild is needed.

on:
  # The 15-minute cadence comes from workers/vitals-cron (a Cloudflare cron that
  # calls workflow_dispatch); GitHub's own schedule is an hourly fallback.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/vitals

      - uses: actions/checkout@v5
        with:
          ref: vitals
          path: vitals-data

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/vitals/requirements.txt

      - run: pip install -r scripts/vitals/requirements.txt

      - name: Fetch from Garmin
        env:
          VITALS_KEY: ${{ secrets.VITALS_KEY }}
        run: python scripts/vitals/fetch.py vitals-data

      - name: Publish
        # Runs even if the fetch failed, so refreshed tokens are never lost.
        if: always()
        working-directory: vitals-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan snapshot
          git add tokens.enc vitals.json running.json 2>/dev/null || git add tokens.enc vitals.json
          git commit -q -m "Vitals $(date -u +%FT%TZ)"
          git push -q -f origin snapshot:vitals
